name: Java CI

on:
  push:
    branches: [main]
    paths:
      - '**/*.java'
      - '**/pom.xml'
      - 'mvnw'
      - '.github/workflows/java-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.java'
      - '**/pom.xml'
      - 'mvnw'
      - '.github/workflows/java-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: springai-java-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: |
          chmod +x ./mvnw
          ./mvnw -B verify
